version: "3.8"

services:
  frontend:
    build:
      context: ../frontend
      dockerfile: ../docker/frontend/Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
      - NEXT_PUBLIC_WS_URL=http://localhost:8000/ws
    volumes:
      - ../frontend/src:/app/src
      - ../frontend/public:/app/public
    depends_on:
      - backend
    networks:
      - man-network

  backend:
    build:
      context: ../backend
      dockerfile: ../docker/backend/Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - ../.env
    environment:
      - DATABASE_URL=postgresql+asyncpg://man:man_secret@postgres:5432/man_db
      - REDIS_URL=redis://redis:6379/0
      - CORS_ORIGINS=http://localhost:3000
    volumes:
      - ../backend/app:/app/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    networks:
      - man-network

  worker:
    build:
      context: ../backend
      dockerfile: ../docker/backend/Dockerfile
    env_file:
      - ../.env
    environment:
      - DATABASE_URL=postgresql+asyncpg://man:man_secret@postgres:5432/man_db
      - REDIS_URL=redis://redis:6379/0
      - DB_POOL_SIZE=5
      - DB_MAX_OVERFLOW=3
    command: python -m app.queue.worker
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      replicas: 4
    restart: unless-stopped
    networks:
      - man-network

  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=man
      - POSTGRES_PASSWORD=man_secret
      - POSTGRES_DB=man_db
    command: postgres -c max_connections=500
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U man -d man_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - man-network

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - man-network

volumes:
  pgdata:
  redisdata:

networks:
  man-network:
    driver: bridge
